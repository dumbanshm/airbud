[project]
name = "airbud-backend"
version = "0.1.0"
description = "Reads flight bookings from your Gmail and serves them to the Airbud app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "extruct>=0.17",
    "icalendar>=6",
    "airportsdata>=20240101",
    "python-dateutil>=2.9",
    "pypdf>=6.20.1",
    "zxing-cpp>=3.1.1",
    "pypdfium2>=5.14.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
